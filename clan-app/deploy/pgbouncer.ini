;; ════════════════════════════════════════════════════════════
;;  PgBouncer — تجميع الاتصالات
;; ════════════════════════════════════════════════════════════
;;
;;  ⚠️ المشكلة التي يحلّها:
;;
;;   Prisma يفتح مجمّعاً لكل عملية. مع connection_limit=10
;;   و50 عملية خلف موازن حِمل = 500 اتصال، وحدّ Postgres
;;   الافتراضي 100 → رفض اتصالات وانهيار.
;;
;;   وحتى لو رفعنا max_connections، كل اتصال في Postgres
;;   عملية نظام كاملة تستهلك ~10MB. ألف اتصال = 10GB رام
;;   للاتصالات وحدها.
;;
;;   PgBouncer يفصل: آلاف اتصالات التطبيق ← عشرات اتصالات
;;   القاعدة الحقيقية.
;;
;;  ⚠️ لا تُشغّله قبل أن تحتاجه.
;;     عملية واحدة أو اثنتان لا تحتاجانه، وهو طبقة إضافية
;;     تفشل. القياس الفاصل: عدد الاتصالات المتزامنة يقترب
;;     من max_connections.

[databases]
;; ⚠️ الاسم يجب أن يطابق ما في DATABASE_URL
clan_app_db = host=127.0.0.1 port=5432 dbname=clan_app_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; ════════════════════════════════════════════════
;;  وضع التجميع — أهم إعداد في الملف
;; ════════════════════════════════════════════════
;;
;; ⚠️ transaction لا session.
;;
;;  session: الاتصال محجوز للعميل حتى ينفصل — أي لا تجميع
;;           فعلي، فائدة شبه معدومة.
;;  transaction: الاتصال يُعاد للمجمّع بعد كل معاملة — هنا
;;           تأتي كل الفائدة (100 عميل على 20 اتصالاً).
;;
;; ⚠️ الثمن: العبارات المُحضَّرة (prepared statements) لا تعمل
;;    عبر المعاملات. لهذا **يجب** إضافة `pgbouncer=true` إلى
;;    DATABASE_URL — تُخبر Prisma بتعطيلها. نسيانها يُنتج
;;    أخطاء "prepared statement already exists" متقطّعة
;;    يصعب تشخيصها لأنها تظهر تحت الحمل فقط.
pool_mode = transaction

;; اتصالات القاعدة الفعلية لكل قاعدة/مستخدم
;; ⚠️ 20 نقطة بداية معقولة: أكبر من عدد نوى القاعدة بقليل.
;;    زيادته لا تسرّع — Postgres لا ينفّذ أكثر مما لديه نوى.
default_pool_size = 20

;; اتصالات إضافية عند الذروة
reserve_pool_size = 5
reserve_pool_timeout = 3

;; أقصى اتصالات من التطبيقات — الرقم الذي "يبدو" كبيراً للتطبيق
max_client_conn = 1000

;; ⚠️ يجب أن يكون أقل من max_connections في postgresql.conf
max_db_connections = 50

;; ════════════════════════════════════════════════
;;  المهلات
;; ════════════════════════════════════════════════

;; ⚠️ استعلام يتجاوز هذا يُقتل. أطول من أي استعلام مشروع
;;    عندنا (أبطأ استعلام قِسناه: 7ms) بهامش ضخم.
query_timeout = 30
query_wait_timeout = 20

;; إغلاق الاتصالات الخاملة — يمنع تراكم اتصالات ميتة
server_idle_timeout = 300
client_idle_timeout = 0

;; ⚠️ إعادة تدوير الاتصالات: يمنع تسرّب الذاكرة طويل الأمد
;;    في عمليات Postgres الخلفية
server_lifetime = 3600

;; ════════════════════════════════════════════════
;;  السجلات
;; ════════════════════════════════════════════════

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; ⚠️ 0 في الإنتاج: تسجيل كل اتصال يغرق القرص عند آلاف
;;    الاتصالات في الدقيقة
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

stats_period = 60

;; من يستطيع الاتصال بقاعدة pgbouncer الإدارية
admin_users = root
stats_users = root
